<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1E3A6E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AG Mobile">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; connect-src 'self' ws: wss: http: https:; img-src 'self' data:; style-src 'self'; script-src 'self'">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/panels.css">
  <link rel="stylesheet" href="/css/animations.css">
  <title>AG Mobile Connect</title>
</head>
<body>

<!-- ── Login Screen ─────────────────────────────────────────────────────── -->
<div id="login-screen" class="login-screen" hidden>
  <div class="login-card">
    <div class="login-logo">🤖</div>
    <h1 class="login-title">AG Mobile Connect</h1>
    <p class="login-subtitle">Enter the password shown in your terminal</p>

    <form id="login-form" autocomplete="off">
      <div class="form-group">
        <input
          type="password"
          id="login-password"
          class="input"
          placeholder="Password"
          autocomplete="current-password"
          autofocus
          required>
      </div>
      <div id="login-error" class="badge badge-error" style="margin-bottom:12px;width:100%;justify-content:center;" hidden></div>
      <button type="submit" class="btn btn-primary btn-full" id="login-btn">
        Connect
      </button>
    </form>
  </div>
</div>

<!-- ── App Shell ─────────────────────────────────────────────────────────── -->
<div id="app-shell" class="app-shell" hidden>

  <!-- Reconnect banner -->
  <div id="reconnect-banner" class="reconnect-banner" role="status" aria-live="polite">
    Reconnecting…
  </div>

  <!-- Header -->
  <header class="app-header">
    <span class="header-title">AG Mobile</span>
    <div class="header-status">
      <span id="header-model" class="header-model"></span>
      <span id="cdp-dot" class="status-dot" title="CDP"></span>
      <span id="ws-dot"  class="status-dot" title="WebSocket"></span>
    </div>
  </header>

  <!-- Panel container -->
  <main class="panel-container">

    <!-- Chat Panel -->
    <section id="panel-chat" class="panel active" data-panel="chat">
      <div id="chat-typing" class="typing-indicator" hidden>
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
        <span style="font-size:12px;color:var(--text-muted);margin-left:6px">Generating…</span>
      </div>
      <div id="chat-approval" class="approval-bar" hidden></div>
      <div id="chat-snapshot" class="panel-snapshot chat-messages"></div>
      <div id="chat-queue" class="queue-indicator" hidden>
        <span id="chat-queue-text">⏳ Queued message</span>
        <button class="btn btn-sm btn-ghost" id="chat-queue-cancel">Cancel</button>
      </div>
      <div class="chat-input-row">
        <div class="chat-textarea-wrap">
          <textarea
            id="chat-input"
            class="textarea"
            placeholder="Message Antigravity…"
            rows="1"
            aria-label="Message input"></textarea>
        </div>
        <button id="chat-send"  class="btn btn-primary btn-icon" aria-label="Send">➤</button>
        <button id="chat-stop"  class="btn btn-danger  btn-icon" aria-label="Stop" hidden>■</button>
      </div>
    </section>

    <!-- Agents Panel -->
    <section id="panel-agents" class="panel" data-panel="agents">
      <div id="agents-list" class="agents-list">
        <div class="empty-state">
          <div class="empty-state-icon">🤖</div>
          <div class="empty-state-text">No active agents</div>
        </div>
      </div>
    </section>

    <!-- Settings Panel -->
    <section id="panel-settings" class="panel settings-panel" data-panel="settings">
      <div class="section-header">Model &amp; Mode</div>
      <div class="card" style="margin:0 16px 16px">
        <div class="form-group">
          <label class="form-label" for="model-select">AI Model</label>
          <select id="model-select" class="select"></select>
        </div>
        <div class="form-group" style="margin-bottom:0">
          <label class="form-label" for="mode-select">Mode</label>
          <select id="mode-select" class="select">
            <option value="fast">Fast</option>
            <option value="planning">Planning</option>
          </select>
        </div>
      </div>

      <div class="section-header">Session</div>
      <div class="card" style="margin:0 16px 16px">
        <button id="new-conversation-btn" class="btn btn-ghost btn-full">
          + New Conversation
        </button>
      </div>

      <div class="section-header">Notifications</div>
      <div class="card" style="margin:0 16px 16px">
        <div class="settings-row">
          <span class="settings-label">Push Notifications</span>
          <button id="push-toggle-btn" class="btn btn-sm btn-ghost">Enable</button>
        </div>
        <div id="push-status-row" class="settings-row" style="border-top:1px solid var(--border-color)">
          <span class="settings-label">Status</span>
          <span id="push-status" class="settings-value">Not enabled</span>
        </div>
      </div>

      <div class="section-header">Connection</div>
      <div class="card" style="margin:0 16px 16px">
        <div class="settings-row">
          <span class="settings-label">CDP</span>
          <span id="settings-cdp-status" class="status-indicator">
            <span class="status-dot"></span> Unknown
          </span>
        </div>
        <div class="settings-row">
          <span class="settings-label">Tunnel</span>
          <span id="settings-tunnel-status" class="settings-value">—</span>
        </div>
        <div class="settings-row">
          <span class="settings-label">Uptime</span>
          <span id="settings-uptime" class="settings-value">—</span>
        </div>
      </div>

      <div class="section-header">Account</div>
      <div class="card" style="margin:0 16px 16px">
        <button id="logout-btn" class="btn btn-ghost btn-full">Log Out</button>
      </div>
    </section>

    <!-- Terminal Panel -->
    <section id="panel-terminal" class="panel" data-panel="terminal">
      <div class="terminal-toolbar">
        <input type="search" id="terminal-search" class="input terminal-search" placeholder="Search…" style="min-height:34px;font-size:13px">
      </div>
      <div id="terminal-output" class="terminal-output"></div>
      <button id="scroll-bottom-btn" class="scroll-to-bottom-btn btn" hidden>↓</button>
    </section>

    <!-- Files Panel -->
    <section id="panel-files" class="panel" data-panel="files">
      <div id="files-list" class="files-list">
        <div class="empty-state">
          <div class="empty-state-icon">📁</div>
          <div class="empty-state-text">File tree not available</div>
        </div>
      </div>
    </section>

  </main>

  <!-- Tab Bar -->
  <nav class="tab-bar" role="tablist">
    <button class="tab-btn active" data-tab="chat" role="tab" aria-selected="true">
      <span class="tab-icon">💬</span>
      <span class="tab-label">Chat</span>
    </button>
    <button class="tab-btn" data-tab="agents" role="tab">
      <span class="tab-icon">🤖</span>
      <span class="tab-label">Agents</span>
      <span id="agents-badge" class="tab-badge" hidden>0</span>
    </button>
    <button class="tab-btn" data-tab="settings" role="tab">
      <span class="tab-icon">⚙️</span>
      <span class="tab-label">Settings</span>
    </button>
    <button class="tab-btn" data-tab="terminal" role="tab">
      <span class="tab-icon">🖥️</span>
      <span class="tab-label">Terminal</span>
    </button>
    <button class="tab-btn" data-tab="files" role="tab">
      <span class="tab-icon">📁</span>
      <span class="tab-label">Files</span>
    </button>
  </nav>

</div>

<!-- Toast container -->
<div id="toast-container" class="toast-container" aria-live="polite"></div>

<script src="/js/app.js" type="module"></script>
</body>
</html>
